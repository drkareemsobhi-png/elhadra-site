<style>
:root{--bg:#ffffff;--surface:#fff7f0;--orange:#e8641c;--orange-deep:#b8480e;--ink:#241a14;--muted:#6f6058;--line:rgba(232,100,28,.22);--err:#c0392b}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;font-size:15px;line-height:1.7;padding-bottom:120px}
a{color:var(--orange-deep)}
.shell{width:min(calc(100% - 28px),980px);margin-inline:auto}
header.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:66px}
.top-in img{width:64px;height:64px;object-fit:contain}
.back{font-size:12px;font-weight:700;color:var(--muted);text-decoration:none}
.hours{padding:12px 0;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.hours b{color:var(--orange-deep)}
h1{font-family:"Amiri",serif;font-size:34px;margin:26px 0 4px;color:var(--orange)}
.sub{margin:0 0 18px;font-size:13px;color:var(--muted)}
.cats{position:sticky;top:66px;z-index:40;display:flex;gap:8px;overflow-x:auto;padding:12px 0;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:0 0 auto;padding:9px 14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:700 12px "Cairo",sans-serif;cursor:pointer;border-radius:999px}
.cats button.on{background:var(--orange-deep);color:#fff;border-color:var(--orange-deep)}
h2.cat{font-family:"Amiri",serif;font-size:26px;color:var(--orange);margin:30px 0 12px;padding-top:8px}
.item{display:grid;grid-template-columns:86px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.thumb{width:86px;height:86px;border-radius:10px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.empty{display:flex;align-items:center;justify-content:center}
.thumb.empty svg{width:34px;height:34px;stroke:var(--orange);opacity:.4;fill:none;stroke-width:1.5}
.item h3{margin:0 0 3px;font-size:14.5px;font-weight:700;color:var(--ink)}
.item .desc{margin:0 0 6px;font-size:12px;color:var(--muted);line-height:1.65}
.item .price{font-size:13.5px;color:var(--orange-deep);font-weight:900}
.item .price small{color:var(--muted);font-weight:600;font-size:11px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:34px;height:34px;border:1px solid var(--orange-deep);background:var(--bg);color:var(--orange-deep);font-size:19px;font-weight:900;line-height:1;cursor:pointer;border-radius:8px}
.step button:disabled{opacity:.3;cursor:default}
.step .q{min-width:22px;text-align:center;font-weight:900}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--bg);border-top:1px solid var(--orange);padding:12px 0;box-shadow:0 -6px 24px rgba(36,26,20,.08)}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:14px}
.bar .sum{font-size:12px;color:var(--muted)}
.bar .sum b{display:block;font-size:17px;color:var(--orange-deep)}
.wabtn{padding:13px 22px;border:0;background:var(--orange-deep);color:#fff;font:900 14px "Cairo",sans-serif;cursor:pointer;border-radius:8px}
.wabtn:disabled{opacity:.5;cursor:default}
.mask{position:fixed;inset:0;z-index:70;background:rgba(36,26,20,.55);display:none}
.mask.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;max-height:92vh;overflow-y:auto;background:var(--bg);border-top:2px solid var(--orange);transform:translateY(100%);transition:transform .25s}
.sheet.on{transform:none}
.sheet-in{width:min(calc(100% - 28px),620px);margin-inline:auto;padding:22px 0 34px}
.sheet h3{display:flex;align-items:center;gap:8px;font-family:"Amiri",serif;font-size:24px;color:var(--orange);margin:0 0 14px}
.lines{margin:0 0 16px;font-size:13px}
.lines div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;font-size:15px;font-weight:900;color:var(--ink);padding:10px 0 16px}
label{display:block;margin:12px 0 5px;font-size:12px;font-weight:700;color:var(--orange-deep)}
input,select,textarea{width:100%;padding:12px;background:var(--bg);border:1px solid var(--line);color:var(--ink);font:400 14px "Cairo",sans-serif;border-radius:8px}
input.err,select.err,textarea.err{border-color:var(--err)}
textarea{min-height:74px;resize:vertical}
.msg{display:none;margin:14px 0 0;padding:11px;background:#fdecea;border:1px solid var(--err);color:#8c2a1e;font-size:13px;border-radius:8px}
.msg.on{display:block}
.note{margin:14px 0 0;font-size:12px;color:var(--muted);line-height:1.9}
.closed{margin:0 0 16px;padding:12px;background:#fdecea;border:1px solid var(--err);color:#8c2a1e;font-size:13px;border-radius:8px}
.x{background:none;border:0;color:var(--muted);font-size:26px;cursor:pointer;margin-inline-start:auto;line-height:1}
@media(max-width:520px){h1{font-size:28px}.item{grid-template-columns:66px 1fr auto;gap:10px}.thumb{width:66px;height:66px}.item .desc{font-size:11.5px}}
</style>

function cairoMinutes() {
  var s = new Date().toLocaleString('en-US', { timeZone: 'Africa/Cairo', hour12: false, hour: '2-digit', minute: '2-digit' });
  var p = s.split(':');
  return parseInt(p[0], 10) % 24 * 60 + parseInt(p[1], 10);
}
function isOpenNow() { var m = cairoMinutes(); return m >= OPEN_MIN && m < CLOSE_MIN; }

function hoursUI() {
  var open = isOpenNow();
  document.getElementById('hoursNote').innerHTML = open
    ? '🟢 <b>مفتوح دلوقتي</b> — بنستقبل الأوردرات لحد 11:30 بالليل'
    : '🔴 <b>استقبال الأوردرات مقفول</b> — بنستقبل يومياً من 2:30 الضهر لحد 11:30 بالليل';
  var b = document.getElementById('openSheet');
  if (b && !orderSent) {
    b.disabled = !open;
    b.textContent = open ? 'اتمم الأوردر' : 'الأوردرات تفتح 2:30 الضهر';
  }
}

function fmt(n) { return n + ' ج'; }

function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function buildMenu() {
  var cats = document.getElementById('cats');
  var menu = document.getElementById('menu');
  var chips = '<button type="button" class="on" data-cat="all">الكل</button>';
  var html = '';
  MENU.forEach(function (c) {
    chips += '<button type="button" data-cat="' + c.key + '">' + c.label + '</button>';
    html += '<section data-sec="' + c.key + '"><h2 class="cat">' + c.label + '</h2>';
    c.items.forEach(function (it) {
      var thumb = it.img
        ? '<div class="thumb"><img src="img/' + it.img + '" alt="' + esc(it.n) + '" loading="lazy" width="86" height="86"></div>'
        : '<div class="thumb empty" aria-hidden="true"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 30h32M12 30a12 12 0 0 1 24 0M24 18v-4M21 14h6"/></svg></div>';
      html += '<div class="item">' + thumb +
        '<div><h3>' + esc(it.n) + '</h3>' +
        (it.d ? '<p class="desc">' + esc(it.d) + '</p>' : '') +
        '<span class="price">' + fmt(it.p) +
        (it.unit ? ' <small>' + it.unit + '</small>' : '') + '</span></div>' +
        '<div class="step">' +
        '<button type="button" data-act="inc" data-id="' + it.id + '" aria-label="زود">+</button>' +
        '<span class="q" id="q_' + it.id + '">0</span>' +
        '<button type="button" data-act="dec" data-id="' + it.id + '" disabled aria-label="قلل">−</button>' +
        '</div></div>';
    });
    html += '</section>';
  });
  cats.innerHTML = chips;
  menu.innerHTML = html;

  cats.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    [].forEach.call(cats.children, function (c) { c.classList.toggle('on', c === b); });
    var k = b.dataset.cat;
    [].forEach.call(menu.children, function (s) {
      s.style.display = (k === 'all' || s.dataset.sec === k) ? '' : 'none';
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  menu.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]'); if (!b) return;
    change(b.dataset.id, b.dataset.act === 'inc' ? 1 : -1);
  });
}

function change(id, d) {
  if (d > 0 && window.ehPixel) {
    window.ehPixel.track('AddToCart', {
      content_name: items[id].n, content_type: 'product',
      value: items[id].p, currency: 'EGP'
    });
  }
  var q = (cart[id] || 0) + d;
  if (q <= 0) delete cart[id]; else cart[id] = q;
  document.getElementById('q_' + id).textContent = cart[id] || 0;
  var dec = document.querySelector('button[data-act="dec"][data-id="' + id + '"]');
  if (dec) dec.disabled = !cart[id];
  renderBar();
}

function totals() {
  var n = 0, t = 0;
  Object.keys(cart).forEach(function (id) { n += cart[id]; t += cart[id] * items[id].p; });
  return { n: n, t: t };
}

function renderBar() {
  var x = totals();
  var bar = document.getElementById('bar');
  bar.hidden = x.n === 0;
  document.getElementById('barCount').textContent = x.n + ' صنف';
  document.getElementById('barTotal').textContent = fmt(x.t);
  hoursUI();
}

function hideErr() { var e = document.getElementById('err'); if (e) e.classList.remove('on'); }
function bad(id, m) {
  var el = document.getElementById(id);
  el.classList.add('err'); showErr(m); el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function validPhone(p) { return /^01[0125][0-9]{8}$/.test(p); }

function submit() {
  if (orderSent) return;
  if (!isOpenNow()) { hoursUI(); showErr('استقبال الأوردرات مقفول دلوقتي. بنستقبل من 2:30 الضهر لحد 11:30 بالليل.'); return; }
  var x = totals();
  if (!x.n) return;
  if (x.t < MIN_ORDER) { showErr('أقل أوردر للتوصيل ' + MIN_ORDER + ' ج. ناقصك ' + (MIN_ORDER - x.t) + ' ج.'); return; }

  var cname = document.getElementById('cname').value.replace(/\s+/g, ' ').trim();
  var phone = document.getElementById('phone').value.replace(/\D/g, '');
  var area = document.getElementById('area').value;
  var addr = document.getElementById('addr').value.trim();
  var notes = document.getElementById('notes').value.trim();
  hideErr();

  if (cname.length < 2) return bad('cname', 'اكتب اسمك عشان نعرف الأوردر باسم مين.');
  if (!validPhone(phone)) return bad('phone', 'اكتب رقم موبايل صحيح — 11 رقم ويبدأ بـ01.');
  if (!area) return bad('area', 'اختار منطقة التوصيل. التوصيل متاح في المناطق اللي في القايمة بس.');
  if (addr.length < 8) return bad('addr', 'اكتب العنوان بالتفصيل عشان الدليفري يوصلك.');

  if (!WEBHOOK) { showErr('استقبال الأوردرات مش مفعّل دلوقتي. كلمنا على 01030080098.'); return; }

  var fee = FEES[area];
  var payload = {
    client_order_id: ElHadraOrders.createClientOrderId(),
    items: Object.keys(cart).map(function (id) {
      return { name: items[id].n, opt: items[id].unit || '', qty: cart[id], price: items[id].p };
    }),
    subtotal: x.t, delivery: fee, total: x.t + fee, area: area,
    customer_name: cname,
    address: '👤 ' + cname + ' — 📞 ' + phone + ' — ' + addr,
    phone: phone, gps: '', notes: notes, src: src
  };

  orderSent = true;
  ElHadraOrders.submitWithConfirmation({
    webhook: WEBHOOK, payload: payload,
    container: document.getElementById('sheetIn'),
    name: cname, total: x.t + fee, area: area,
    onConfirmed: function () {
      if (!window.ehPixel) return;
      window.ehPixel.track('Purchase', {
        value: x.t + fee, currency: 'EGP', num_items: x.n,
        content_type: 'product',
        contents: payload.items.map(function (it) {
          return { id: it.name, quantity: it.qty, item_price: it.price };
        })
      });
    }
  });
}

document.getElementById('openSheet').addEventListener('click', openSheet);
document.getElementById('mask').addEventListener('click', closeSheet);

buildMenu(); renderBar(); hoursUI(); setInterval(hoursUI, 60000);
</script>
</body>
</html>
